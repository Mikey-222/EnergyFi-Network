[workspace]
resolver = "2"
members = ["energy-credit", "installments", "project", "referral"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91.0"

[workspace.dependencies]
soroban-sdk = "27.0.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
